# Runs every time you add or change something. It shrinks new photos,
# then builds the journal and publishes it on GitHub Pages. Free for public repositories.
name: Publish journal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shrink photos
        run: |
          pip install --quiet pillow
          python .github/scripts/shrink_photos.py

      - name: Save shrunk photos back to the repository
        run: |
          if [ -n "$(git status --porcelain photos)" ]; then
            git config user.name "journal-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos
            git commit -m "Shrink photos"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
